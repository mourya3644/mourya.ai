
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-site-verification" content="AM8ZYZMnxtELoPB-gccxYk507y79G2BttDawMeQHlBE" />
<title>Mourya AI</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #0b1020;
    color: white;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 95%;
    max-width: 850px;
    height: 90vh;
    background: #151c30;
    border: 1px solid #29334d;
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 0 35px #0008;
}

header {
    padding: 22px;
    background: #1b2540;
    border-bottom: 1px solid #29334d;
}

header h1 {
    color: #7c9cff;
    font-size: 25px;
}

header p {
    color: #aab4cc;
    margin-top: 5px;
    font-size: 13px;
}

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

.message {
    padding: 13px 16px;
    margin: 12px 0;
    border-radius: 12px;
    max-width: 85%;
    line-height: 1.5;
    white-space: pre-wrap;
}

.user {
    background: #465fdb;
    margin-left: auto;
}

.ai {
    background: #25314b;
    margin-right: auto;
}

.input-area {
    display: flex;
    padding: 15px;
    gap: 10px;
    background: #1b2540;
}

input {
    flex: 1;
    padding: 15px;
    border: 1px solid #34415e;
    border-radius: 10px;
    outline: none;
    background: #0e1629;
    color: white;
    font-size: 15px;
}

button {
    padding: 0 22px;
    background: #637df5;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
}

button:hover {
    background: #4964df;
}

footer {
    text-align: center;
    padding: 10px;
    font-size: 11px;
    color: #8491aa;
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>✦ Mourya AI</h1>
    <p>Your personal AI assistant</p>
</header>

<div id="chat">
    <div class="message ai">
        Hello! 👋 Welcome to Mourya AI.
        How can I help you today?
    </div>
</div>

<div class="input-area">
    <input
        type="text"
        id="userInput"
        placeholder="Ask me anything..."
        onkeydown="if(event.key==='Enter') sendMessage()"
    >
    <button onclick="sendMessage()">Send ➤</button>
</div>

<footer>
    Mourya AI © 2026 | AI Chat Website
</footer>

</div>

<script>
const chat = document.getElementById("chat");

function addMessage(text, sender) {
    const message = document.createElement("div");
    message.className = "message " + sender;
    message.textContent = text;
    chat.appendChild(message);
    chat.scrollTop = chat.scrollHeight;
}

function getAIResponse(question) {
    const q = question.toLowerCase();

    if (q.includes("hello") || q.includes("hi")) {
        return "Hello! Welcome to Mourya AI. How can I help you?";
    }

    if (q.includes("your name")) {
        return "I am Mourya AI, your virtual assistant!";
    }

    if (q.includes("time")) {
        return "Current time: " + new Date().toLocaleTimeString();
    }

    if (q.includes("date")) {
        return "Today's date is " + new Date().toLocaleDateString();
    }

    if (q.includes("html")) {
        return "HTML is used to create the structure of websites.";
    }

    if (q.includes("javascript")) {
        return "JavaScript makes websites interactive and dynamic.";
    }

    if (q.includes("bye")) {
        return "Goodbye! Have a great day! 👋";
    }

    return "That's an interesting question! This is a demo AI website. Connect an AI API to get real AI-generated answers.";
}

function sendMessage() {
    const input = document.getElementById("userInput");
    const question = input.value.trim();

    if (!question) return;

    addMessage(question, "user");
    input.value = "";

    setTimeout(() => {
        const response = getAIResponse(question);
        addMessage(response, "ai");
    }, 500);
}
</script>

</body>
</html>
